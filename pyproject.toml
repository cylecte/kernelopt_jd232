[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cylecte-kernelopt_jd232"
version = "0.1.0"
description = "解析时间标记，排列AI 芯片算子优化工程师·合成数据的质量分水岭的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cylecte" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cylecte.github.io"
Repository = "https://github.com/cylecte/kernelopt_jd232"
Issues = "https://github.com/cylecte/kernelopt_jd232/issues"

[project.scripts]
kernelopt_jd232 = "kernelopt_jd232:main"

[tool.setuptools]
py-modules = ["kernelopt_jd232"]
